name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  # Principle IV: a failure on either operating system blocks the release.
  # Both are required checks; neither is advisory.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web bundle
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build

      - name: Build
        run: go build -trimpath ./...

      - name: Unit and integration tests
        run: go test -count=1 ./...

      - name: Security gate
        run: go test -count=1 -run 'Security|Traversal|Replay|Unpaired|LogHygiene' ./...

      - name: Network boundary gate
        run: go test -count=1 -run 'NetworkBoundary' ./...

  # Constitution Principle II: no essential capability may depend on something
  # iOS Safari lacks. WebKit is the closest thing to Safari that runs
  # unattended, and this is the only place both browsers are available: its
  # Playwright build is Ubuntu-only and will not launch on Fedora or Arch, so a
  # developer runs Chromium and the gate lives here.
  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Install browsers
        working-directory: web
        run: npx playwright install --with-deps chromium webkit

      # The tests drive the real binary, so it has to exist and to embed the
      # bundle the tests are about to click on.
      - name: Build
        run: make build

      - name: Browser tests
        working-directory: web
        run: npm run test:e2e

      - name: Accessibility gate
        working-directory: web
        run: npm run test:a11y

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      # The action's major version has to match the linter's. This job spent its
      # whole life on @v6, which installs golangci-lint v1, while .golangci.yml
      # is a v2 config — so every run died on "the configuration contains
      # invalid elements" before reaching a single linter. @v9 installs v2.
      #
      # The linter version is pinned rather than "latest" so a new release
      # cannot turn this job red on a morning when nothing here changed.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Lint web application
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run lint

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Constitution quality gate 6. A key, certificate, or pairing token
      # reaching a public repository is not recoverable by deleting the commit.
      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject committed key material
        run: |
          if git ls-files | grep -E '\.(pem|key|crt|p12|pfx)$'; then
            echo "::error::Key material is committed. See .gitignore and Principle VII."
            exit 1
          fi
